<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <title>MindSync AI - Results</title>
</head>
<body>
    <div class="container">
        <h1>MindSync AI Results</h1>
        <div class="results">
            <h2>Your Digital Wellbeing Score: {{ wellbeing_score }}</h2>
            <h2>Smartphone Addiction Risk: {{ addiction_risk }}</h2>
            <h2>Productivity Level: {{ productivity_level }}</h2>
        </div>
        <div class="recommendations">
            <h3>Recommendations:</h3>
            <ul>
                {% for recommendation in recommendations %}
                    <li>{{ recommendation }}</li>
                {% endfor %}
            </ul>
        </div>
        <a href="{{ url_for('main.index') }}" class="btn">Back to Home</a>
    </div>
</body>
</html>
